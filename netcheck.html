<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>联机网络检测</title>
<style>
:root{--paper:#f3ecdc;--ink:#2a2420;--mute:#7a6f62;--ok:#2f6b4f;--bad:#a8322a;--line:#d8cdb6}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Noto Serif SC","Songti SC",serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:.08em}
p{margin:0 0 16px;color:var(--mute);font-size:14px}
ol{list-style:none;padding:0;margin:0 0 18px}
li{display:flex;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
li b{flex:1;font-weight:600}
li span{font-size:14px;color:var(--mute);text-align:right}
li i{font-style:normal;width:1.4em;text-align:center;font-weight:700}
li.ok i{color:var(--ok)} li.bad i{color:var(--bad)}
#sum{font-size:15px;padding:12px;border:1px solid var(--line);background:#faf6ec;white-space:pre-wrap;margin-bottom:12px}
button{font:inherit;padding:10px 18px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:4px}
</style>
</head>
<body>
<main>
<h1>联机网络检测</h1>
<p>打开后自动检测，大约 15 秒。全部跑完后截图发给 Claude，或点"复制结果"粘贴过去。</p>
<ol id="list"></ol>
<div id="sum">检测中…</div>
<button id="copy" hidden>复制结果</button>
</main>
<script>
const rand=n=>Math.random().toString(36).slice(2,2+n);
const list=document.getElementById('list');
const rows=[];
function row(name){const li=document.createElement('li');li.innerHTML='<i>…</i><b></b><span>检测中</span>';li.querySelector('b').textContent=name;list.append(li);const r={name,li,res:null};rows.push(r);return r;}
function done(r,ok,note){r.res={ok,note};r.li.className=ok?'ok':'bad';r.li.querySelector('i').textContent=ok?'✓':'✗';r.li.querySelector('span').textContent=note;}
const T0=()=>performance.now();
function timeout(ms){return new Promise(res=>setTimeout(()=>res({ok:false,note:'超时（'+(ms/1000)+' 秒）'}),ms));}

// 1. PeerJS public broker: the server answers {"type":"OPEN"} on its WebSocket
function peerjs(){
  return new Promise(res=>{
    const t=T0();let ws;
    try{ws=new WebSocket('wss://0.peerjs.com/peerjs?key=peerjs&id=skgchk'+rand(10)+'&token='+rand(10)+'&version=1.5.4');}catch(e){return res({ok:false,note:'无法连接'});}
    ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='OPEN'){res({ok:true,note:Math.round(T0()-t)+' 毫秒'});ws.close();}}catch(_){}};
    ws.onerror=()=>res({ok:false,note:'连接失败'});
    ws.onclose=ev=>res({ok:false,note:'被断开（'+ev.code+'）'});
  });
}
// 2. MQTT over WebSocket: CONNECT, SUBSCRIBE, PUBLISH to ourselves, wait for the echo
const enc=new TextEncoder();
function str(s){const b=enc.encode(s);return [b.length>>8,b.length&255,...b];}
function rl(n){const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d);}while(n>0);return o;}
function pkt(h,body){return new Uint8Array([h,...rl(body.length),...body]);}
function mqtt(host){
  return new Promise(res=>{
    const t=T0();let ws,stage='连接';
    try{ws=new WebSocket('wss://'+host+':8084/mqtt',['mqtt']);}catch(e){return res({ok:false,note:'无法连接'});}
    ws.binaryType='arraybuffer';
    const topic='skgomoku/netcheck/'+rand(10),msg='ping'+rand(6);let tConn=0;
    ws.onopen=()=>{stage='握手';ws.send(pkt(0x10,[...str('MQTT'),4,2,0,60,...str('skgchk'+rand(10))]));};
    ws.onmessage=e=>{
      const b=new Uint8Array(e.data),type=b[0]>>4;
      if(type===2){if(b[3]!==0)return res({ok:false,note:'被拒绝（'+b[3]+'）'});tConn=T0()-t;stage='订阅';ws.send(pkt(0x82,[0,1,...str(topic),0]));}
      else if(type===9){stage='收发';ws.send(pkt(0x30,[...str(topic),...enc.encode(msg)]));}
      else if(type===3){res({ok:true,note:'连上 '+Math.round(tConn)+' 毫秒，收发 '+Math.round(T0()-t-tConn)+' 毫秒'});try{ws.send(new Uint8Array([0xe0,0]));ws.close();}catch(_){}}
    };
    ws.onerror=()=>res({ok:false,note:stage+'失败'});
    ws.onclose=ev=>res({ok:false,note:stage+'时被断开（'+ev.code+'）'});
  });
}
// 3. script CDNs (opaque fetch: resolves only when the host answers)
function cdn(url){const t=T0();return fetch(url+'?t='+Date.now(),{mode:'no-cors',cache:'no-store'}).then(()=>({ok:true,note:Math.round(T0()-t)+' 毫秒'}),()=>({ok:false,note:'打不开'}));}
// 4. STUN: does this network learn its public address (needed for phone-to-phone links)
function stun(urls){
  return new Promise(res=>{
    let pc;try{pc=new RTCPeerConnection({iceServers:[{urls}]});}catch(e){return res({ok:false,note:'浏览器不支持'});}
    const t=T0();let got=false;
    pc.onicecandidate=e=>{if(e.candidate&&/ typ srflx /.test(e.candidate.candidate)&&!got){got=true;res({ok:true,note:Math.round(T0()-t)+' 毫秒'});pc.close();}};
    pc.createDataChannel('x');pc.createOffer().then(o=>pc.setLocalDescription(o));
    setTimeout(()=>{if(!got){res({ok:false,note:'没有回应'});try{pc.close();}catch(_){}}},6000);
  });
}
// 5. TURN: a relayed address from the PeerJS TURN server (the fallback when phones can't link directly)
function turn(url){
  return new Promise(res=>{
    let pc;try{pc=new RTCPeerConnection({iceServers:[{urls:url,username:'peerjs',credential:'peerjsp'}],iceTransportPolicy:'relay'});}catch(e){return res({ok:false,note:'浏览器不支持'});}
    const t=T0();let got=false;
    pc.onicecandidate=e=>{if(e.candidate&&/ typ relay /.test(e.candidate.candidate)&&!got){got=true;res({ok:true,note:Math.round(T0()-t)+' 毫秒'});pc.close();}};
    pc.createDataChannel('x');pc.createOffer().then(o=>pc.setLocalDescription(o));
    setTimeout(()=>{if(!got){res({ok:false,note:'没有回应'});try{pc.close();}catch(_){}}},8000);
  });
}
const tests=[
  ['PeerJS 公共中转（现在联机用的）',()=>peerjs(),12000],
  ['EMQX 国内服务器',()=>mqtt('broker-cn.emqx.io'),12000],
  ['EMQX 全球服务器',()=>mqtt('broker.emqx.io'),12000],
  ['jsDelivr 脚本库',()=>cdn('https://cdn.jsdelivr.net/npm/peerjs@1.5.4/package.json'),10000],
  ['unpkg 脚本库',()=>cdn('https://unpkg.com/peerjs@1.5.4/package.json'),10000],
  ['STUN 小米',()=>stun('stun:stun.miwifi.com:3478'),7000],
  ['STUN 腾讯',()=>stun('stun:stun.qq.com:3478'),7000],
  ['TURN 中继（PeerJS）',()=>turn('turn:eu-0.turn.peerjs.com:3478'),9000],
];
(async()=>{
  const rs=tests.map(([n])=>row(n));
  await Promise.all(tests.map(([n,f,ms],k)=>Promise.race([f(),timeout(ms)]).then(r=>done(rs[k],r.ok,r.note))));
  const net=navigator.connection&&navigator.connection.effectiveType?' · 网络 '+navigator.connection.effectiveType:'';
  const text='联机网络检测 '+new Date().toLocaleString('zh-CN')+net+'\n'+rows.map(r=>(r.res.ok?'✓ ':'✗ ')+r.name+'：'+r.res.note).join('\n');
  document.getElementById('sum').textContent=text;
  const b=document.getElementById('copy');b.hidden=false;
  b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(text).then(()=>{b.textContent='已复制';},()=>{b.textContent='复制失败，请截图';});};
})();
</script>
</body>
</html>
